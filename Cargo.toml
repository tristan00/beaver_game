[workspace]
resolver = "2"
members = ["crates/sim", "crates/game", "crates/runner"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.sim]
opt-level = 3

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
opt-level = "s"
panic = "abort"

[profile.release.package.sim]
opt-level = 3

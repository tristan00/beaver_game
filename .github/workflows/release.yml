name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          old=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          IFS=. read -r major minor patch <<< "$old"
          case "$BUMP" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          git ls-remote --exit-code --tags origin "v$new" && { echo "Tag v$new already exists"; exit 1; }
          sed -i "s/^version = \"$old\"/version = \"$new\"/" Cargo.toml
          cargo update --workspace
          echo "VERSION=$new" >> "$GITHUB_ENV"
          echo "Releasing $old -> $new"

      - run: cargo build --release --locked --bin beaver_colony
      - run: mv target/release/beaver_colony.exe "beaver_colony-v$VERSION-windows-x86_64.exe"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:master "v$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" beaver_colony-*.exe --title "v$VERSION" --generate-notes

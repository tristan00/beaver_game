# Buildings. `work` is the labour to build one; `area` its work area (cells across and along); `requires` a building that
# must stand finished first. built_as: Site (dropped as a site, the default), Dam or Canal (drawn as a line of cells;
# one of each). home: houses a family, behind a door kept clear. docks_rafts: rafts load and unload at it. wear:
# condition lost a day, before weather and water. A building with a Sentry seat keeps watch; one with Hauler seats evens
# out the stores. Looks: model (a model id in the game), footing (mound, ring or piles, half-size across and along),
# icon, the key that picks it to build, its place in the build menu, and whether its area is drawn round.
# slots: the seats it has, each a job. stores: the goods it holds.
# refits: Facing, Reinforce and ReinforcedRepair (the extra a reinforced building's repair takes): materials as a
# fixed `cost` and `per_cell` of the building (a dam: per dam cell, each rounded up), labour (+ labour_per_cell, at
# least min_labour), and how many times longer it lasts (lasts).

repair_fallback = [["Sticks", 1.0]]  # what repairing a building that cost nothing takes
works = { gate = [["Sticks", 6.0]], lock = [["Sticks", 12.0], ["Mud", 4.0]], gate_needs = "HaulMound", lock_needs = "RaftLanding" }  # works that are not buildings: a gate, making one a lock, and the building each needs finished first


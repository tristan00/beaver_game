# Jobs. duty: what the job does: Gather (the kinds of resource whose `role` is this job), Build, Haul, Forest (collect
# seedlings and plant them round a forester), Watch (keep watch at a lookout) or Mend (repair buildings and keep dams
# and canals in order, without a seat); one job does each duty but Gather.
# name: the job, plural: its beavers; skill: the skill it builds, in words. priority: its place on the colony panel, first first.
# shore_limit: the player may keep it near the water. skill_speeds: skill makes it go faster (hauling is walking, and a
# watch is kept, not worked). icon, and path_colour (sRGB) for its beavers' paths. Epithet pools are keyed by the job's
# key in lower case (names.toml).

[[job]]
key = "Forager"
name = "Forager"
plural = "foragers"
skill = "Foraging"
duty = "Gather"
priority = 1
shore_limit = true
skill_speeds = true
icon = "RoleForager"
path_colour = [0.45, 0.85, 0.25]


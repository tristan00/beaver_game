[package]
name = "sim"
edition.workspace = true
version.workspace = true

[dependencies]
rand_core = "0.10"
rand_pcg = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["use-std"] }

[build-dependencies]
rusqlite = { version = "=0.38.0", features = ["bundled"] }

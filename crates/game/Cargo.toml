[package]
name = "game"
edition.workspace = true
version.workspace = true

[[bin]]
name = "beaver_colony"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }
bevy = { version = "=0.20.1" }
winit = { version = "0.30.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
